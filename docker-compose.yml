name: belltower

# Settings come from the .env file next to this one (copy .env.example to .env).
# Every ${VAR:-default} below falls back to its default when .env doesn't set it.

services:
  belltower:
    # Prebuilt image from GitHub. TT_VERSION in .env picks the channel or an exact version
    # (latest, 1.2, 1.2.0, …). Versions before 1.2.0 are only at ghcr.io/bernie-sandler/tower-tracker.
    # To build from this folder instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/bernie-sandler/belltower:${TT_VERSION:-latest}
    container_name: belltower
    restart: unless-stopped
    # Proper PID 1 (signal forwarding, zombie reaping); the app checkpoints SQLite on SIGTERM.
    init: true
    stop_grace_period: 30s
    ports:
      # One PORT for both sides: the port on Unraid and the port the app listens on in the container.
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      TZ: ${TZ:-America/Chicago}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      APP_PASSWORD: ${APP_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Installs from before the rename keep their old folder: set DATA_PATH in .env (docs/UPGRADING.md).
      - ${DATA_PATH:-/mnt/cache/appdata/belltower}:/data
