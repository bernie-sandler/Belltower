# The browser-only demo (docs/DEMO.md): built on every pull request, built and published to GitHub
# Pages on every push to main. https://bernie-sandler.github.io/Belltower/
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One Pages deployment at a time, and never cancel one half-way; PR builds just restart.
  group: demo-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The demo needs only the web app, so no native modules either.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      # Pages serves the site under /<repository>/ (base_path); a custom domain would serve it at /.
      - run: npm run build:demo
        env:
          VITE_DEMO_BASE: ${{ steps.pages.outcome == 'success' && format('{0}/', steps.pages.outputs.base_path) || '/Belltower/' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-demo

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
