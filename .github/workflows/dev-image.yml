name: Dev image

# Publishes ghcr.io/<owner>/<repository>:dev from the tip of the dev branch, so a test container can follow dev without
# version bumps or tags. Code reaches dev through pull requests that already passed CI, so CI isn't run again here.
# Version images are only published by release.yml (releases, "latest") and prerelease.yml (release candidates).

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest dev commit matters: a newer push cancels an image build that is still running.
concurrency:
  group: dev-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64

jobs:
  publish:
    name: Publish :dev image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=dev
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Summary
        run: printf '```\ndocker pull %s:dev\n```\n' "${IMAGE,,}" >> "$GITHUB_STEP_SUMMARY"

  # Removes the untagged leftovers of the :dev build this push replaced (once they are an hour old).
  cleanup-images:
    name: Clean up images
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cleanup-images.yml
