# Publishes the Docker image as :dev on every push to the dev branch, after the full CI passes:
#   push to dev → :dev    (no GitHub Release, no version tag; the image moves with every push)
# The image reports the version in package.json; its version label adds -dev.
name: Dev image

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

# A newer push cancels an older run, so an older build can never land on :dev after a newer one.
concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version and image tag
        id: v
        run: |
          PKG=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$PKG-dev"
            echo "tags=$IMAGE:dev"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Belltower
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
