# Tests on every push and pull request; also run by release.yml before publishing an image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, tests, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Same install as the Dockerfile: better-sqlite3 ships prebuilt binaries, so no scripts are needed.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Also checks that the bundle has no external (CDN) URLs.
      - run: npm run build
      # Uses the runner's installed Chrome (channel 'chrome'); no browser download.
      - run: npm run e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: coverage/e2e-report
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: belltower:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and reports healthy
        run: |
          docker run -d --name tt -p 18080:8080 -e APP_PASSWORD=ci-only-password belltower:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:18080/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs tt
          exit 1
