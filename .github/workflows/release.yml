# Publishes the Docker image to GHCR and a GitHub Release when a version tag is pushed:
#   v1.3.0-rc.1   → :1.3.0-rc.1, :rc                      (pre-release; older rc Release pages are deleted)
#   v1.3.0        → :1.3.0, :1.3, :1, :latest             (release; every other Release page is deleted)
# The tag must match the version in package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version and image tags
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*-rc.*)   VERSION="${TAG#v}";      CHANNEL=rc ;;
            v*-*)      echo "Only vX.Y.Z and vX.Y.Z-rc.N tags are released, not $TAG"; exit 1 ;;
            v*)        VERSION="${TAG#v}";      CHANNEL=stable ;;
            *) echo "Unexpected tag $TAG"; exit 1 ;;
          esac
          PKG=$(node -p "require('./package.json').version")
          BASE="${VERSION%%-*}"
          if [ "$PKG" != "$BASE" ]; then
            echo "Tag $TAG is version $BASE but package.json says $PKG"; exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          MAJOR="${BASE%%.*}"; MINOR="${BASE#*.}"; MINOR="${MINOR%%.*}"
          TAGS="$IMAGE:$VERSION"
          case "$CHANNEL" in
            stable) TAGS="$TAGS,$IMAGE:$MAJOR.$MINOR,$IMAGE:$MAJOR,$IMAGE:latest" ;;
            rc)     TAGS="$TAGS,$IMAGE:rc" ;;
          esac
          {
            echo "version=$VERSION"
            echo "base=$BASE"
            echo "channel=$CHANNEL"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Belltower
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.v.outputs.base }}" '
            $0 ~ "^## " v "([^0-9.]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "No CHANGELOG.md section for ${{ steps.v.outputs.base }}"; exit 1; fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: Belltower ${{ steps.v.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.v.outputs.channel != 'stable' }}

      # The Releases page shows only the newest release: a final deletes every other Release page (older finals and
      # all rcs), an rc deletes older rc pages and leaves the current final. Only the pages go: git tags and images
      # stay (people pin image versions). A failure here doesn't fail the release.
      - name: Delete older Release pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | "\(.tagName) \(.isPrerelease)"' |
          while read -r old pre; do
            [ "$old" = "$GITHUB_REF_NAME" ] && continue
            if [ "$CHANNEL" = stable ] || [ "$pre" = true ]; then
              echo "Deleting Release $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
