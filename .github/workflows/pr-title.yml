name: PR title

# Pull requests into dev are squash-merged, so the PR title becomes the commit message on dev. This checks that it
# is a Conventional Commit ("feat: ...", "fix(api): ..."). The deps, deps-dev and docker types are the prefixes
# Dependabot uses. Release PRs from dev into main and merges from main back into dev aren't squashed, so they are
# skipped.

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            perf
            test
            build
            style
            revert
            release
            deps
            deps-dev
            docker
          requireScope: false
          # "feat: Add X" is fine; only the type has to match.
          subjectPattern: ^.+$
